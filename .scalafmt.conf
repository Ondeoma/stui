# IntelliJ IDEA 2026.2 のコードスタイル(Default スキーム)に近づけた scalafmt 設定
# 新しい scalafmt が出ていれば version を上げてください
version = 3.11.5
runner.dialect = scala3

# --- 幅とインデント(IntelliJ の Scala 既定値: 右マージン 120 / インデント 2 / 継続インデント 2)---
maxColumn = 120
indent.main = 2
indent.callSite = 2
indent.defnSite = 2
indent.extendSite = 2

# --- 改行の扱い(IntelliJ の「Keep line breaks」が既定で ON なのに合わせて、既存の改行を残す)---
newlines.source = keep

# --- メソッド定義のパラメータ(METHOD_PARAMETERS_WRAP = 2: Wrap always)---
# 引数が 2 個以上あれば 1 行に 1 個ずつ並べる
verticalMultiline.atDefnSite = true
verticalMultiline.arityThreshold = 1
verticalMultiline.newlineAfterOpenParen = true
danglingParentheses.defnSite = true

# 呼び出し側は IntelliJ 既定(折り返さない)に近づける
danglingParentheses.callSite = true
binPack.callSite = false

# --- 位置揃え(IntelliJ の Scala 既定では、ほとんど揃えない)---
align.preset = none
align.stripMargin = true

# --- 複数行文字列(MULTILINE_STRING_ALIGN_DANGLING_CLOSING_QUOTES = true)---
assumeStandardLibraryStripMargin = true

# --- Scaladoc(IntelliJ の「Use scaladoc indent for leading asterisk」に合わせる)---
docstrings.style = Asterisk
docstrings.wrap = no

# --- スペース(IntelliJ 既定: import a.{b, c} の波括弧の内側に空白を入れない)---
spaces.inImportCurlyBraces = false

# --- 末尾カンマ(既存のものはそのまま残す)---
rewrite.trailingCommas.style = keep

# --- 好みに応じて有効化 ---
# rewrite.rules = [SortImports, RedundantBraces, RedundantParens]
# rewrite.scala3.convertToNewSyntax = true   # Scala 3 で新構文へ寄せる場合

# --- sbirds: インデント記法を使わない（波括弧を省いた形へは書き換えない）---
rewrite.scala3.removeOptionalBraces = false

# --- sbirds: ビルドの出力は対象外 ---
project.excludePaths = ["glob:**/target/**", "glob:**/node_modules/**"]
