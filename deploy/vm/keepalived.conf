# /etc/keepalived/keepalived.conf（priority をノードごとに 150/100/50 などに変える）
vrrp_script chk_haproxy {
  script "/usr/bin/killall -0 haproxy"
  interval 2
  fall 2
  rise 2
}
vrrp_instance STUI_VIP {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 150
  advert_int 1
  nopreempt
  authentication {
    auth_type PASS
    auth_pass change-me
  }
  virtual_ipaddress {
    10.0.0.10/24
  }
  track_script {
    chk_haproxy
  }
}
