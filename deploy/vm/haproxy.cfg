# /etc/haproxy/haproxy.cfg（3台とも同じ）。VIP(10.0.0.10) は keepalived が持つ。
global
  log /dev/log local0
  maxconn 4096
defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h          # WebSocket
frontend https
  bind :443 ssl crt /etc/haproxy/certs/stui.example.com.pem alpn h2,http/1.1
  bind :80
  http-request redirect scheme https unless { ssl_fc }
  http-request set-header X-Forwarded-Proto https
  default_backend stui
backend stui
  balance roundrobin          # ページの担当ノードへの振り分けはアプリが行う
  option httpchk GET /healthz
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server stui1 10.0.0.11:8080 check
  server stui2 10.0.0.12:8080 check
  server stui3 10.0.0.13:8080 check
# 添付ファイル（各VMで動かす S3 互換ストレージを VIP:7480 にまとめる。外部のストレージを使うなら削除し、S3_ENDPOINT をそちらに向ける）
frontend s3
  bind 10.0.0.10:7480
  default_backend s3
backend s3
  balance leastconn
  option httpchk GET /
  server s3-1 10.0.0.11:8000 check
  server s3-2 10.0.0.12:8000 check
  server s3-3 10.0.0.13:8000 check
frontend stats
  bind 127.0.0.1:8404
  stats enable
  stats uri /
