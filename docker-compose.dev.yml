# 開発用: PostgreSQL + PGroonga（本番は Patroni）、ScalaS3（S3互換ストレージ）、
# Mailpit（送信メールを受け止めるだけの SMTP。http://localhost:8027 で中身を見られる）
# skiwi の開発環境と同時に動かせるよう、ポートをずらしている
name: stui
services:
  db:
    image: groonga/pgroonga:4.1.0-alpine-17-slim
    environment:
      POSTGRES_USER: stui
      POSTGRES_PASSWORD: stui
      POSTGRES_DB: stui
    ports: ["54379:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-stui-test.sql:ro   # テスト用DB stui_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stui"]
      interval: 2s
      retries: 30
  s3:
    build: { context: ./deploy/docker, dockerfile: scalas3.Dockerfile }   # 初回はソースからビルドする
    image: stui-scalas3:dev
    environment:
      SCALAS3_ACCESS_KEY: stui
      SCALAS3_SECRET_KEY: stuistuistuistui
    ports: ["3920:3900"]
    volumes: ["s3data:/var/lib/scalas3/data"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["1027:1025", "8027:8025"]
volumes:
  pgdata:
  s3data:
